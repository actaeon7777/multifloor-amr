planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 4000
        w_smooth: 0.95
        w_data: 0.02
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 6
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.1
      required_movement_angle: 0.3
      movement_time_allowance: 10.0
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.6
      angular_disengage_threshold: 0.2
      forward_sampling_distance: 1.0
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.8
      simulate_ahead_time: 2.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      closed_loop: false
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.02
      max_speed_xy: 1.0
      min_speed_theta: 0.04
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.6
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.6
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - WheelSpeed
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - BaseObstacle
      - PreferForward
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      PreferForward.scale: 1.0
      PreferForward.penalty: 0.5
      PreferForward.strafe_x: 0.1
      PreferForward.strafe_theta: 0.12
      PreferForward.theta_scale: 0.5
      BaseObstacle.scale: 0.12
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.5
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.5
      PathDist.scale: 32.0
      GoalDist.scale: 32.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 3.0
      RotateToGoal.lookahead_time: -1.0
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.05
      publish_local_plan: true
      publish_global_plan: true
      publish_trajectories: false
      publish_evaluation: false
      publish_cost_grid_pc: false
      WheelSpeed.class: amr_nav2_plugins::WheelSpeedCritic
      WheelSpeed.scale: 1.0
      ObstacleFootprint.scale: 0.02
    odom_topic: /odometry/filtered
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
      stateful: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.2
      resolution: 0.05
      rolling_window: false
      plugins:
      - static_layer
      - obstacle_layer
      - depth_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.1
          obstacle_max_range: 5.0
          raytrace_min_range: 0.1
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0
      depth_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 10.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /camera/depth/points_filtered
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          expected_update_rate: 0.0
          min_obstacle_height: 0.06
          max_obstacle_height: 1.0
          obstacle_range: 3.0
          inf_is_valid: false
          voxel_min_points: 0
          clear_after_reading: true
        depth_clear:
          topic: /camera/depth/points
          data_type: PointCloud2
          marking: false
          clearing: true
          model_type: 0
          min_z: 0.35
          max_z: 5.1
          horizontal_fov_angle: 1.613
          vertical_fov_angle: 1.155
          decay_acceleration: 15.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          clear_after_reading: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.6
        cost_scaling_factor: 2.0
      always_send_full_costmap: false
      track_unknown_space: true
      robot_radius: 0.44
      footprint_padding: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      resolution: 0.05
      rolling_window: true
      plugins:
      - obstacle_layer
      - depth_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          obstacle_min_range: 0.1
          obstacle_max_range: 5.0
          raytrace_min_range: 0.1
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0
      depth_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 10.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /camera/depth/points_filtered
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0
          expected_update_rate: 0.0
          min_obstacle_height: 0.06
          max_obstacle_height: 1.0
          obstacle_range: 3.0
          inf_is_valid: false
          voxel_min_points: 0
          clear_after_reading: true
        depth_clear:
          topic: /camera/depth/points
          data_type: PointCloud2
          marking: false
          clearing: true
          model_type: 0
          min_z: 0.35
          max_z: 5.1
          horizontal_fov_angle: 1.613
          vertical_fov_angle: 1.155
          decay_acceleration: 15.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          clear_after_reading: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.6
        cost_scaling_factor: 2.0
      always_send_full_costmap: false
      width: 6
      height: 6
      footprint: '[[0.328, 0.287], [0.328, -0.287], [-0.328, -0.287], [-0.328, 0.287]]'
      footprint_padding: 0.02
behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 20
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    transform_tolerance: 0.2
navigation_manager:
  ros__parameters:
    use_sim_time: false
    require_localization_ready: true
    localization_status_timeout: 2.0
    publish_rate: 20.0
    command_timeout: 0.2
    backend_response_timeout: 5.0
    restart_quiet_period: 0.1
    max_linear_speed: 1.0
    max_angular_speed: 0.6
