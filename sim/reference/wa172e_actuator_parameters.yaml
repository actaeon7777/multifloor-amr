assumptions:
  - The screenshots apply to both left and right WA172E/ODrive axes.
  - The motor performance envelope uses 12.357 N m at zero speed and KV 8.7 rpm/V at the 24 V nominal bus as a conservative linear approximation.
  - The ODrive 2 turn/s soft limit is the normal command clamp; 3 turn/s is enforced separately as the PhysX hard joint-speed limit.
  - The 6 A DC bus input limit and regenerative current/brake resistor behavior are recorded but are not represented by the per-joint PhysX drive model.
  - ODrive velocity integrator gain is recorded but is not modeled because PhysicsDriveAPI provides a PD drive, not an integral controller state.
  - The 5 N m/(rad/s) effective Physics drive gain is a PI-response surrogate; the raw ODrive proportional term alone is 0.477464829 N m/(rad/s).
  - The chassis-space acceleration limits keep the worst simultaneous linear-plus-angular wheel ramp below the ODrive 2 turn/s^2 setting.
