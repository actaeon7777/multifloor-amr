# Local dead reckoning, ROS 2 Jazzy robot_localization.
# State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    debug: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    use_control: false

    odom0: /wheel/odometry
    # Use measured forward velocity plus the nonholonomic vy=0 constraint.
    # vy=0 is a model assumption (variance 0.01), not measured lateral slip.
    # Ignore encoder-integrated pose and wheel yaw rate: slip distorted yaw
    # in the floor tests. No duplicate fusion of pose from the same encoders.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data_raw
    # Calibrated gyro Z only; CAN provides no attitude measurement.
    # Do not integrate linear acceleration or fuse a fabricated orientation.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
