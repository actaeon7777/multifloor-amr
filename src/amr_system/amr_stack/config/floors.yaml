# Central console return-home destination.
home: {floor: "4F", room: "401"}
# 층·지도·장면·엘리베이터 지점 설정 (층간 이동). 설명: docs/ELEVATOR.md
#
# 지도를 교체할 때는 이 파일만 고친다. 파서: amr_stack/floor_config.py
# 경로 기준
#   map, annotations, sim_map : amr_stack 패키지 기준 (소스 src/amr_system/amr_stack, 설치 share/amr_stack 동일)
#   sim_layer                 : AMR 워크스페이스 기준 (시뮬레이션 전용)
# 좌표는 각 층 지도의 map 프레임 [x, y] 또는 [x, y, yaw] (m, rad).
# provisional_copy_of: 다른 층 지도를 복사한 임시본이면 원본 층 이름. 실측 지도로 바꾸면 지운다.
schema_version: 1
building: G
default_floor: "4F"

elevators:
  E1:
    car_interior_m: [1.87, 2.23]     # [문 벽 방향 폭, 깊이]  docs/images/Elevator_size.jpg
    door_width_m: 1.10
    door_offset_from_left_m: 0.385   # 홀에서 카를 바라볼 때 카 왼쪽 안벽 ~ 출입구
    threshold_depth_m: 0.66          # 층 벽(홀 문 평면) ~ 카 안쪽 벽
    door_open_time_s: [6.0, 10.0]

floors:
  "3F":
    level: 3
    beacon_floor_code: 3
    real_enabled: true               # 2026-10-24 실차 시험(홀 호출~카 안 정렬) 통과 후 켜 둠. 카 비콘 설치 전에는 카 안 SELECT_FLOOR에서 NO_CAR_ACK로 안전 정지 → LB로 수동 회수
    # 실측 지도(2026-10-06)를 4F 좌표계로 정렬. 영역지정·sim_map·sim_layer·호실은 아직 4F 복사본 (maps/G_3_floor/MAP_SOURCE.md)
    map: maps/G_3_floor/3_floor_1006.yaml
    annotations: maps/G_3_floor/3_floor_tmp_from_4F(영역지정).png
    sim_map: maps/sim_floor3/floor3.yaml
    sim_layer: sim/layers/3_floor_tmp_from_4F_map.usda
    spawn: [11.5, 3.31, 0.0]
    elevators:
      E1:
        door_center: [9.975, 3.31]
        car_inward_yaw: 3.141593     # 홀 → 카 진입 방향
        hall_wait_pose: [10.975, 3.31, 3.141593]   # 2026-10-27: 1.0 m from the door (was 0.6 m: bumper 27 cm from the door blocked people leaving the car)
