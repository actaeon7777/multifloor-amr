# 지도 없는 통과층. 홀 비콘(RF node 0x40 + 층)은 1–7F에 설치돼 있다(docs/ELEVATOR_RF_PROTOCOL.md §6.2).
# 여기 층에 카가 서면 "다른 층"으로 보고 계속 탑승한다. 목적지로는 고를 수 없다.
# 실측 지도가 생기면 floors로 옮기고 여기서 지운다. level·beacon_floor_code는 floors와 겹치면 안 된다.
