amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 1.0
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_min_range: -1.0
    # Keep distant corridor structure observable while tracking. The actual
    # LaserScan range_max still bounds sensor returns below this cap.
    laser_max_range: 30.0
    laser_likelihood_max_dist: 2.0
    # Startup uses denser scans; navigation_startup switches to tracking_max_beams
    # only after localization passes verification (1080 -> 60 by default).
    max_beams: 1080
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    lambda_short: 0.1
    do_beamskip: false
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.1
    update_min_a: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Physical pose is unknown: use global localization or /initialpose.
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: 0.5
map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: map
