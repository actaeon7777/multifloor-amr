# 야간 순찰 경로. 지점 사이는 Nav2가 주행한다; 꺾이는 곳과 끝에만 지점을 둔다. docs/PATROL.md
# 각 지점은 별도 NavigateToPose 목표라 정지·방향 정렬한다. dwell_s: 0은 추가 대기 없음.
# yaw 생략 시 이동 방향을 사용해 정렬 회전을 줄인다. 무정지 통과는 아직 지원하지 않는다.
