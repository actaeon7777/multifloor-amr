tim_global_localizer:
  ros__parameters:
    service_name: /localization/global_localize
    max_beams: 1080
    max_range: 30.0
    max_timeout_sec: 30.0
    max_map_cells: 4000000
    threads: 2
    random_seed: 7
    map_sampling_ratio: 2
    sampling_duration_sec: 1
    anchor_spacing: 0.40
    # Clearance of proposed LASER positions, not a complete robot footprint check.
    min_laser_clearance: 0.20
    angle_search_step: 0.19634954084936207
    batch_size: 200
    candidates_per_batch: 20
    min_score: 0.85
    max_score: 0.98
    sigma_hit: 0.2
    max_tolerance_dist: 3.0
    max_correspondence_distance: 1.6
    icp_iterations: 60
    nms_distance: 0.75
    nms_angle: 0.30
    # Both stages use up to 1080 beams; only the top candidates get this pass.
    fine_enabled: true
    fine_max_candidates: 5
    fine_max_beams: 1080
    fine_map_sampling_ratio: 1
    fine_icp_iterations: 60
    fine_correspondence_distance: 0.30
    fine_max_translation: 0.25
    fine_max_yaw: 0.10
    fine_min_overlap: 0.70
    fine_min_geometry_ratio: 0.002
    fine_budget_sec: 3.0
    fine_min_score_gain: 0.000001
